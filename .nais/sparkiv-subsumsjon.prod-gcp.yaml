spec:
  replicas:
    min: 1
    max: 10
    scalingStrategy:
      cpu:
        thresholdPercentage: 200
  resources:
    requests:
      cpu: 10m
      memory: 256Mi
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-custom-1-3840
        databases:
          - name: sparkiv-subsumsjon
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: KAN_SE_SUBSUMSJONER
      value: "false"
