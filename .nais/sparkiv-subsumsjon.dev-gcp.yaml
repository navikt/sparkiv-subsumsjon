spec:
  ingresses:
    - https://sparkiv-subsumsjon.ansatt.dev.nav.no
  resources:
    requests:
      cpu: 20m
      memory: 512Mi
  kafka:
    pool: nav-dev
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-f1-micro
        databases:
          - name: sparkiv-subsumsjon
            envVarPrefix: DATABASE
  env:
    - name: KAN_SE_SUBSUMSJONER
      value: "true"
