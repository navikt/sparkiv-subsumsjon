apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sparkiv-subsumsjon
  namespace: tbd
  labels:
    team: tbd
spec:
  image: {{image}}
  port: 8080
  strategy:
    type: Recreate
  liveness:
    path: isalive
    initialDelay: 5
  readiness:
    path: isready
    initialDelay: 15
  preStopHook:
    http:
      path: /stop
  prometheus:
    enabled: true
    path: /metrics
  replicas:
    min: 1
    max: 10
    scalingStrategy:
      cpu:
        thresholdPercentage: 200
  resources:
    limits:
      memory: 640Mi
    requests:
      cpu: 10m
      memory: 256Mi
  kafka:
    pool: nav-prod
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        diskAutoresize: true
        tier: db-custom-1-3840
        databases:
          - name: sparkiv-subsumsjon
            envVarPrefix: DATABASE
        flags:
          - name: cloudsql.enable_pgaudit
            value: "on"
          - name: pgaudit.log
            value: "write,ddl,role"
          - name: pgaudit.log_parameter
            value: "on"
          - name: pgaudit.log_relation
            value: "on"
  env:
    - name: KAFKA_TOPIC
      value: flex.omrade-helse-etterlevelse
    - name: CONSUMER_GROUP_ID
      value: sparkiv-subsumsjon-v1
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
