apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: sparkiv-subsumsjon-frontend
  namespace: tbd
  labels:
    team: tbd
spec:
  image: {{image}}
  port: 8080
  ingresses:
    - https://sparkiv-subsumsjon-frontend.intern.dev.nav.no
  liveness:
    path: /
    initialDelay: 5
  readiness:
    path: /
    initialDelay: 5
  replicas:
    min: 1
    max: 1
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 20m
      memory: 64Mi
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
