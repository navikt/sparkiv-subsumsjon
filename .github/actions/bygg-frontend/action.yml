name: Bygg frontend
description: Setter opp pnpm, installerer avhengigheter og bygger frontend/dist

inputs:
  npm-auth-token:
    required: true
    description: Token for å hente @navikt-pakker fra npm.pkg.github.com

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: frontend/package.json

    # Skriver en bruker-.npmrc som leser NODE_AUTH_TOKEN, slik at pnpm kan hente @navikt-pakker
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        registry-url: https://npm.pkg.github.com
        scope: "@navikt"
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: pnpm install
      shell: bash
      working-directory: frontend
      env:
        NODE_AUTH_TOKEN: ${{ inputs.npm-auth-token }}
      run: pnpm install --frozen-lockfile

    - name: pnpm run build
      shell: bash
      working-directory: frontend
      run: pnpm run build
